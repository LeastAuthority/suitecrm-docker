name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'docker-compose.yml'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'docker-compose.yml'
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
      packages: write
    steps:
      - name: Chechout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Log in to GitHub Container Registry
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version info
        id: get_version
        run: |
          echo "SUITCRM_VERSION=$(grep '^ENV SUITECRM_VERSION=' src/Dockerfile | cut -d'=' -f2)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: ./src
          push: false

      - name: Push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: ./src
          push: true
          tags: |
            ghcr.io/leastauthority/suitecrm:${{ github.event_name != 'pull_request' && format('{0}-latest', github.ref_name) || format('pr-{0}', github.event.pull_request.number) }}
            ${{ github.ref_name == 'main' && format('ghcr.io/leastauthority/suitecrm:{0}-{1}', env.SUITECRM_VERSION, env.SHORT_SHA) || '' }}
